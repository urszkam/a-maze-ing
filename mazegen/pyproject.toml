[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generator and solver"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Ula Kaminska", email = "urkamins@student.42warsaw.pl" },
    { name = "Vineet Jain", email = "vijain@student.42warsaw.pl" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.14.3",
]

[tool.setuptools]
packages = ["mazegen"]
package-dir = { mazegen = "." }

[tool.setuptools.package-data]
mazegen = ["README.md", "LICENSE.md", "py.typed"]
